<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #e2e2e2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell</td>
                <td>15.000.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Chuột không dây</td>
                <td>250.000 VNĐ</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Bàn phím cơ</td>
                <td>850.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Màn hình máy tính</td>
                <td>3.500.000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
