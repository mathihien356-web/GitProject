<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px 16px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #ccc;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .gender label {
            display: inline-block;
            margin-right: 20px;
            font-weight: normal;
        }
        button {
            width: 100%;
            padding: 11px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #146c43;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Đăng ký người dùng</h2>

        <form action="http://demo.codegym.vn/6/registration_form/register.php"
              method="POST">
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name"
                       placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Nhập địa chỉ email" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Nhập số điện thoại" required>
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <div class="gender">
                    <label><input type="radio" name="gender" value="Nam" required> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                </div>
            </div>

            <button type="submit">Đăng ký</button>
        </form>
    </div>
</body>
</html>
