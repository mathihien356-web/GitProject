<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form thông tin cá nhân</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px;
        }
        .form-box {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccd3dc;
        }
        h2 {
            text-align: center;
            color: #2457a7;
        }
        label {
            display: block;
            margin: 14px 0 6px;
        }
        input[type="text"], input[type="email"] {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #b8c2cc;
            border-radius: 5px;
        }
        .hobby label {
            display: inline-block;
            margin-right: 12px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        input[type="submit"], input[type="reset"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"] {
            background: #2457a7;
            color: white;
        }
        input[type="reset"] {
            background: #e0e5eb;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Thông tin cá nhân</h2>

        <form action="#" method="get">
            <label for="yourname">Họ và tên</label>
            <input type="text" id="yourname" name="yourname"
                   placeholder="Nhập họ và tên" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Nhập email" required>

            <label>Sở thích</label>
            <div class="hobby">
                <label><input type="checkbox" name="hobby" value="Đọc sách"> Đọc sách</label>
                <label><input type="checkbox" name="hobby" value="Du lịch"> Du lịch</label>
                <label><input type="checkbox" name="hobby" value="Thể thao"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="Âm nhạc"> Âm nhạc</label>
            </div>

            <div class="buttons">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>
</body>
</html>
