<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập nhúng CSS</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal-text {
            color: green;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="embedded-css.css">
</head>
<body>
    <h1>Bài tập nhúng CSS vào HTML</h1>

    <h2>Phần 1: Inline CSS</h2>
    <p style="color: red;">
        Đây là đoạn văn sử dụng inline CSS, màu chữ đỏ.
    </p>

    <h2>Phần 2: Internal CSS</h2>
    <p class="internal-text">
        Đây là đoạn văn sử dụng internal CSS, màu chữ xanh lá.
    </p>

    <h2>Phần 3: External CSS</h2>
    <p class="external-text">
        Đây là đoạn văn sử dụng external CSS, màu chữ xanh dương.
    </p>
</body>
</html>
