<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành bảng trong CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #333;
            padding: 15px;
            text-align: left;
        }

        th {
            height: 50px;
            background-color: #333;
            color: white;
        }

        td {
            height: 40px;
            vertical-align: middle;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e0e7ff;
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Danh sách sinh viên</h1>

    <table>
        <caption>Bảng thông tin sinh viên</caption>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ và tên</th>
                <th>Tuổi</th>
                <th>Lớp</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Nguyễn Văn An</td>
                <td>20</td>
                <td>Web</td>
                <td>an@example.com</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Trần Thị Bình</td>
                <td>21</td>
                <td>Java</td>
                <td>binh@example.com</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Lê Minh Cường</td>
                <td>20</td>
                <td>Web</td>
                <td>cuong@example.com</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Phạm Thu Hà</td>
                <td>22</td>
                <td>Java</td>
                <td>ha@example.com</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Hoàng Đức Nam</td>
                <td>21</td>
                <td>Web</td>
                <td>nam@example.com</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
